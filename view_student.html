<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Student Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🎓 Student Management System</a>
        <a href="index.html" class="btn btn-sm btn-outline-light">Back to Dashboard</a>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <div class="card shadow-lg border-0 overflow-hidden rounded-4">
        <div class="row g-0">
            <div class="col-md-5 bg-dark d-flex align-items-center justify-content-center" style="min-height: 400px;">
                <div id="studentCarousel" class="carousel slide w-100" data-bs-ride="carousel">
                    <div class="carousel-inner" id="carouselImages">
                        <div class="text-center text-white my-5">Loading photos...</div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#studentCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#studentCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
            
            <div class="col-md-7">
                <div class="card-body p-5">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 id="s_name" class="fw-bold text-primary mb-0">Loading...</h2>
                        <span class="badge bg-success fs-6 px-3 py-2 rounded-pill">Active</span>
                    </div>
                    
                    <hr class="mb-4 text-muted">
                    
                    <h5 class="fw-bold text-secondary mb-3">Contact Information</h5>
                    <div class="bg-white p-3 rounded shadow-sm border mb-4">
                        <p class="fs-5 mb-2">📧 <strong>Email:</strong> <span id="s_email" class="text-dark">...</span></p>
                        <p class="fs-5 mb-0">📞 <strong>Phone:</strong> <span id="s_phone" class="text-dark">...</span></p>
                    </div>
                    
                    <h5 class="fw-bold text-secondary mb-3">Home Address</h5>
                    <p id="s_address" class="fs-5 text-dark bg-white p-3 rounded shadow-sm border">...</p>

                    <div class="mt-5 d-flex gap-3">
                        <a href="index.html" class="btn btn-secondary btn-lg px-4">&larr; Dashboard</a>
                        <a id="editBtn" href="#" class="btn btn-warning btn-lg px-4 fw-bold shadow-sm">Edit Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // URL eken lamayage ID eka gannawa
    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('id');

    if(!studentId) {
        alert("Student ID is missing!");
        window.location.href = "index.html";
    }

    // Backend eken data gennagannawa
    fetch(`get_student.php?id=${studentId}`)
        .then(response => response.json())
        .then(data => {
            if(data.id) {
                // Details tika HTML ekata danawa
                document.getElementById('s_name').innerText = data.full_name;
                document.getElementById('s_email').innerText = data.email;
                document.getElementById('s_phone').innerText = data.phone ? data.phone : 'Not Provided';
                document.getElementById('s_address').innerText = data.address ? data.address : 'Not Provided';
                document.getElementById('editBtn').href = `edit_student.html?id=${data.id}`;

                // Photos load kirima
                const carouselInner = document.getElementById('carouselImages');
                carouselInner.innerHTML = ''; // Kalin thibba loading text eka makala danawa

                if(data.images && data.images.length > 0) {
                    data.images.forEach((img, index) => {
                        let activeClass = index === 0 ? 'active' : '';
                        carouselInner.innerHTML += `
                            <div class="carousel-item ${activeClass}">
                                <img src="${img}" class="d-block w-100" style="height: 450px; object-fit: contain; background-color: #212529;" alt="Student Photo">
                            </div>
                        `;
                    });
                } else {
                    // Photos nathnam default image ekak pennanawa
                    carouselInner.innerHTML = `
                        <div class="carousel-item active">
                            <img src="https://ui-avatars.com/api/?name=${data.full_name}&background=random&color=fff&size=400" class="d-block w-100" style="height: 450px; object-fit: contain; background-color: #212529;" alt="No Photo">
                        </div>
                    `;
                }
            } else {
                alert("Student not found!");
                window.location.href = "index.html";
            }
        })
        .catch(error => {
            console.error('Error fetching data:', error);
            alert("Something went wrong while loading data.");
        });
</script>
</body>
</html>
