<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">Edit Student Details</h4>
                </div>
                <div class="card-body p-4">
                    <div id="messageBox"></div>
                    <form id="editStudentForm">
                        <input type="hidden" id="student_id">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" id="full_name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Phone Number</label>
                            <input type="text" id="phone" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Home Address</label>
                            <textarea id="address" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-warning btn-lg fw-bold">Update Student</button>
                            <a href="index.html" class="btn btn-outline-secondary">Back to Dashboard</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    
    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('id');

    
    fetch(`get_student.php?id=${studentId}`)
        .then(response => response.json())
        .then(data => {
            if(data.id) {
                document.getElementById('student_id').value = data.id;
                document.getElementById('full_name').value = data.full_name;
                document.getElementById('email').value = data.email;
                document.getElementById('phone').value = data.phone;
                document.getElementById('address').value = data.address;
            }
        });

    
    document.getElementById('editStudentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const updateData = {
            id: document.getElementById('student_id').value,
            full_name: document.getElementById('full_name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value
        };

        fetch('update_student.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updateData)
        })
        .then(response => response.json())
        .then(data => {
            const msgBox = document.getElementById('messageBox');
            if(data.status === 'success') {
                msgBox.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
            } else {
                msgBox.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
            }
        });
    });
</script>
</body>
</html>
