<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">🎓 Student Management System</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3 fw-bold">Welcome, <span id="userNameDisplay" class="text-warning">User</span>!</span>
            <a href="profile.html" class="btn btn-sm btn-info text-white fw-bold me-2">My Profile</a>
            <button onclick="logout()" class="btn btn-sm btn-outline-danger fw-bold">Logout</button>
        </div>
    </div>
</nav>

<div class="container">
    
    <div class="row mb-4">
        <div class="col-md-4 mb-3 mb-md-0">
            <div class="card text-white bg-primary shadow-sm border-0 h-100">
                <div class="card-body">
                    <h5 class="card-title">Total Students</h5>
                    <h1 id="totalStudentsCount" class="display-4 fw-bold">0</h1>
                </div>
            </div>
        </div>
        <div class="col-md-8 d-flex flex-column justify-content-center">
            <div class="d-flex justify-content-end mb-2">
                <a href="add_student.html" class="btn btn-success shadow-sm fw-bold">+ Add New Student</a>
            </div>
            <div class="input-group shadow-sm">
                <input type="text" id="searchInput" class="form-control" placeholder="Search by name or email..." onkeyup="searchStudents()">
                <button class="btn btn-outline-secondary bg-white text-dark" type="button" onclick="searchStudents()">Search</button>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-5">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-bold text-secondary">Student Directory</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Email Address</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white py-3">
            <nav>
                <ul class="pagination justify-content-center mb-0" id="paginationControls">
                    </ul>
            </nav>
        </div>
    </div>
</div>

<script>

if(!localStorage.getItem('user_id')) {
    window.location.href = 'login.html';
} else {
    
    document.getElementById('userNameDisplay').innerText = localStorage.getItem('user_name');
}


function logout() {
    localStorage.clear(); 
    window.location.href = 'login.html';
}

let currentPage = 1;
let currentSearch = "";

document.addEventListener("DOMContentLoaded", function() {
    fetchStudents(currentPage, currentSearch);
});

function searchStudents() {
    currentSearch = document.getElementById('searchInput').value;
    currentPage = 1; 
    fetchStudents(currentPage, currentSearch);
}

function changePage(page) {
    currentPage = page;
    fetchStudents(currentPage, currentSearch);
}

function fetchStudents(page, search) {
    fetch(`read_students.php?page=${page}&search=${search}`)
    .then(response => response.json())
    .then(data => {
        let tableBody = document.getElementById('studentTableBody');
        let totalCount = document.getElementById('totalStudentsCount');
        let paginationControls = document.getElementById('paginationControls');
        
        tableBody.innerHTML = ''; 
        paginationControls.innerHTML = '';

        if(data.paging && data.paging.total_records !== undefined) {
            totalCount.innerText = data.paging.total_records;
        }

        if(data.records && data.records.length > 0) {
            data.records.forEach(student => {
                let row = `<tr>
                    <td><span class="badge bg-secondary">#${student.id}</span></td>
                    <td class="fw-bold">${student.full_name}</td>
                    <td>${student.email}</td>
                    <td>${student.phone}</td>
                    <td>
                        <a href="view_student.html?id=${student.id}" class="btn btn-sm btn-info text-white fw-bold">View</a>
                        <a href="edit_student.html?id=${student.id}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent(${student.id})">Delete</button>
                    </td>
                </tr>`;
                tableBody.innerHTML += row;
            });

            let totalPages = data.paging.total_pages;
            for(let i = 1; i <= totalPages; i++) {
                let activeClass = (i === page) ? "active" : "";
                paginationControls.innerHTML += `<li class="page-item ${activeClass}"><a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a></li>`;
            }
        } else {
            tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">No students found.</td></tr>`;
        }
    })
    .catch(error => console.error('Error fetching data:', error));
}

function deleteStudent(id) {
    if(confirm("Are you sure you want to delete this student?")) {
        fetch('delete_student.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id })
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                alert(data.message);
                fetchStudents(currentPage, currentSearch); 
            } else {
                alert(data.message);
            }
        });
    }
}
</script>

</body>
</html>
