<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    </style>
</head>
<body>

<div class="card border-0">
    <div class="card-body p-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Welcome Back!</h2>
            <p class="text-muted">Please login to your account</p>
        </div>
        
        <div id="messageBox"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Email Address</label>
                <input type="email" id="email" class="form-control form-control-lg" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold text-secondary">Password</label>
                <input type="password" id="password" class="form-control form-control-lg" required>
            </div>
            <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold">Login to Dashboard</button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted">Don't have an account? <a href="register.html" class="text-decoration-none fw-bold">Register here</a></p>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    let email = document.getElementById('email').value;
    let password = document.getElementById('password').value;
    let msgBox = document.getElementById('messageBox');

    let loginData = { email: email, password: password };

    fetch('login_user.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(loginData)
    })
    .then(response => response.json())
    .then(data => {
        if(data.status === 'success') {
            msgBox.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
            
            // User details browser eke save karanawa
            localStorage.setItem('user_id', data.id);
            localStorage.setItem('user_name', data.name);
            localStorage.setItem('user_role', data.role);
            
            // Dashboard ekata yanawa
            setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        } else {
            msgBox.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
        }
    })
    .catch(error => console.error('Error:', error));
});
</script>

</body>
</html>
