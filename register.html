<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
    </style>
</head>
<body>

<div class="card border-0">
    <div class="card-body p-5">
        <h3 class="text-center fw-bold mb-4">Create an Account</h3>
        <div id="messageBox"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label text-muted">Full Name</label>
                <input type="text" id="name" class="form-control form-control-lg" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted">Email Address</label>
                <input type="email" id="email" class="form-control form-control-lg" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted">Password</label>
                <input type="password" id="password" class="form-control form-control-lg" required minlength="6">
            </div>
            <div class="mb-4">
                <label class="form-label text-muted">Confirm Password</label>
                <input type="password" id="confirm_password" class="form-control form-control-lg" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Register Now</button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted">Already have an account? <a href="login.html" class="text-decoration-none fw-bold">Login here</a></p>
        </div>
    </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    let name = document.getElementById('name').value;
    let email = document.getElementById('email').value;
    let password = document.getElementById('password').value;
    let confirm_password = document.getElementById('confirm_password').value;
    let msgBox = document.getElementById('messageBox');

    
    if(password !== confirm_password) {
        msgBox.innerHTML = `<div class="alert alert-warning">Passwords do not match!</div>`;
        return;
    }

    let userData = { name: name, email: email, password: password };

    fetch('register_user.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(userData)
    })
    .then(response => response.json())
    .then(data => {
        if(data.status === 'success') {
            msgBox.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
            document.getElementById('registerForm').reset();
            
            setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        } else {
            msgBox.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
        }
    });
});
</script>

</body>
</html>
