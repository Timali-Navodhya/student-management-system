<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🎓 Student Management System</a>
        <div class="d-flex align-items-center">
            <a href="index.html" class="btn btn-sm btn-outline-light me-2">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <img src="https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff&size=100" id="profileImage" class="rounded-circle mb-3 shadow" alt="Profile Picture">
                        <h3 class="fw-bold mb-0">My Profile</h3>
                        <p class="text-muted">Manage your account details</p>
                    </div>

                    <div id="messageBox"></div>

                    <form id="profileForm">
                        <input type="hidden" id="user_id">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" id="name" class="form-control form-control-lg" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" id="email" class="form-control form-control-lg" required>
                        </div>
                        <hr class="my-4">
                        <h5 class="text-muted mb-3">Change Password (Optional)</h5>
                        <div class="mb-4">
                            <label class="form-label fw-bold">New Password</label>
                            <input type="password" id="password" class="form-control form-control-lg" placeholder="Leave blank to keep current password">
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">Save Changes</button>
                            <a href="index.html" class="btn btn-outline-secondary btn-lg">Back to Dashboard</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Security check
    if(!localStorage.getItem('user_id')) {
        window.location.href = 'login.html';
    }

    const userId = localStorage.getItem('user_id');
    
    // Page load weddi details tika gannawa
    fetch(`get_profile.php?id=${userId}`)
    .then(response => response.json())
    .then(data => {
        if(data.id) {
            document.getElementById('user_id').value = data.id;
            document.getElementById('name').value = data.name;
            document.getElementById('email').value = data.email;
            
            // Avatar eke nama wenas karanawa
            document.getElementById('profileImage').src = `https://ui-avatars.com/api/?name=${data.name}&background=0D8ABC&color=fff&size=100`;
        }
    });

    // Form eka submit karaddi
    document.getElementById('profileForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const updateData = {
            id: document.getElementById('user_id').value,
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        fetch('update_profile.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updateData)
        })
        .then(response => response.json())
        .then(data => {
            const msgBox = document.getElementById('messageBox');
            if(data.status === 'success') {
                msgBox.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
                // Browser eke save wela thiyena nama aluth karanawa
                localStorage.setItem('user_name', updateData.name);
                
                // Avatar eka aluth karanawa
                document.getElementById('profileImage').src = `https://ui-avatars.com/api/?name=${updateData.name}&background=0D8ABC&color=fff&size=100`;
                document.getElementById('password').value = ''; // Password box eka clear karanawa
            } else {
                msgBox.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
            }
        });
    });
</script>

</body>
</html>
